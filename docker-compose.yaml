services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    networks:
      - weba-network

  db-server:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: heslo
      MYSQL_DATABASE: my_web
    volumes:
      # Levá strana je cesta u vás, pravá strana je speciální složka v kontejneru
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weba-network

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db-server
    networks:
      - weba-network

networks:
  weba-network:
    driver: bridge
